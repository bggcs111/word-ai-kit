<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>WordAiKit - 自然语言润色</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">WordAiKit</div>
                <button class="btn-icon" id="newTaskBtn" title="新建任务">+</button>
            </div>
            <div class="task-list" id="taskList">
                <!-- 任务列表由 JS 生成 -->
            </div>
            <div class="sidebar-footer">
                <button class="btn-text" id="openConfigBtn">
                    <span>⚙️</span> 模型配置
                </button>
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <span class="current-task-name" id="currentTaskName" contenteditable="true" title="点击修改任务名称">新任务</span>
                </div>
                <div class="topbar-right">
                    <div class="model-select-wrapper">
                        <span class="model-label">模型</span>
                        <select id="modelSelect" class="model-select">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <span class="status-dot" id="serviceStatusDot" title="服务状态"></span>
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome" id="welcomeView">
                    <div class="welcome-title">自然语言润色</div>
                    <div class="welcome-desc">
                        上传 Word 文档，用自然语言描述你想要的风格、结构或内容要求。<br>
                        系统会保留原文核心内容与图片、表格、公式，重新生成连贯文章。
                    </div>
                    <div class="quick-actions">
                        <button class="quick-btn" data-prompt="请用学术风格重写，逻辑严密，保留所有图表公式。">学术风格</button>
                        <button class="quick-btn" data-prompt="请用通俗易懂的科普风格重写，保留所有图表公式。">科普风格</button>
                        <button class="quick-btn" data-prompt="请重新组织文章结构，增加小标题，使层次更清晰，保留所有图表公式。">重新组织结构</button>
                        <button class="quick-btn" data-prompt="请对原文进行精简，去除冗余表达，保留核心内容和所有图表公式。">精简表达</button>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <div class="input-area">
                <div class="file-preview" id="filePreview" style="display: none;">
                    <span class="file-preview-name" id="filePreviewName"></span>
                    <button class="file-preview-remove" id="filePreviewRemove" title="移除文件">×</button>
                </div>
                <div class="input-row">
                    <button class="attach-btn" id="attachFileBtn" title="上传文档">📎</button>
                    <input type="file" id="fileInput" accept=".docx" multiple style="display: none;">
                    <textarea
                        id="promptInput"
                        class="prompt-input"
                        rows="1"
                        placeholder="输入你的要求，例如：请用正式的技术文档风格重写，分三个章节..."
                    ></textarea>
                    <button class="send-btn" id="sendBtn" title="开始处理">➤</button>
                </div>
                <div class="input-hint">
                    支持 .docx 格式，可同时上传多个文档 · 提示词会自动保存到当前任务
                </div>
            </div>
        </main>
    </div>

    <!-- 配置模态框 -->
    <div id="configModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>模型配置</h3>
                <span class="close" id="closeConfigModal">×</span>
            </div>
            <div class="modal-body">
                <div class="storage-path-section">
                    <div class="form-group">
                        <label>配置文件保存路径</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="storagePath" placeholder="例如：C:\Users\用户名\Documents">
                            <button class="btn btn-secondary" id="saveStoragePathBtn">保存路径</button>
                        </div>
                        <small class="form-hint">请填写完整绝对路径，不要保存在项目目录中。</small>
                    </div>
                </div>

                <div class="config-tabs" id="configTabs">
                    <button class="tab-btn active" data-tab="deepseek">DeepSeek</button>
                    <button class="tab-btn" data-tab="aliyun">阿里百炼</button>
                    <button class="tab-btn" data-tab="kimi">Kimi</button>
                    <button class="tab-btn" data-tab="ollama">Ollama</button>
                    <button class="tab-btn" data-tab="lmstudio">LM Studio</button>
                </div>

                <div class="tab-contents">
                    <div id="deepseek" class="tab-content active">
                        <div class="form-group"><label>API Key</label><input type="password" class="form-control" id="deepseekApiKey" placeholder="输入 DeepSeek API Key"></div>
                        <div class="form-group"><label>Base URL</label><input type="text" class="form-control" id="deepseekBaseUrl" value="https://api.deepseek.com"></div>
                        <div class="form-group"><label>模型名称</label><input type="text" class="form-control" id="deepseekModel" value="deepseek-chat"></div>
                    </div>
                    <div id="aliyun" class="tab-content">
                        <div class="form-group"><label>API Key</label><input type="password" class="form-control" id="aliyunApiKey" placeholder="输入阿里百炼 API Key"></div>
                        <div class="form-group"><label>Base URL</label><input type="text" class="form-control" id="aliyunBaseUrl" value="https://dashscope.aliyuncs.com/compatible-mode/v1"></div>
                        <div class="form-group"><label>模型名称</label><input type="text" class="form-control" id="aliyunModel" value="qwen3.5-plus"></div>
                    </div>
                    <div id="kimi" class="tab-content">
                        <div class="form-group"><label>API Key</label><input type="password" class="form-control" id="kimiApiKey" placeholder="输入 Kimi API Key"></div>
                        <div class="form-group"><label>Base URL</label><input type="text" class="form-control" id="kimiBaseUrl" value="https://api.moonshot.cn/v1"></div>
                        <div class="form-group"><label>模型名称</label><input type="text" class="form-control" id="kimiModel" value="kimi-k2.5"></div>
                    </div>
                    <div id="ollama" class="tab-content">
                        <div class="form-group"><label>API Key</label><input type="text" class="form-control" id="ollamaApiKey" value="ollama"></div>
                        <div class="form-group"><label>Base URL</label><input type="text" class="form-control" id="ollamaBaseUrl" value="http://localhost:11434/v1"></div>
                        <div class="form-group"><label>模型名称</label><input type="text" class="form-control" id="ollamaModel" value="qwen2.5:7b"></div>
                    </div>
                    <div id="lmstudio" class="tab-content">
                        <div class="form-group"><label>API Key</label><input type="text" class="form-control" id="lmstudioApiKey" value="lmstudio"></div>
                        <div class="form-group"><label>Base URL</label><input type="text" class="form-control" id="lmstudioBaseUrl" value="http://localhost:1234/v1"></div>
                        <div class="form-group"><label>模型名称</label><input type="text" class="form-control" id="lmstudioModel" value="local-model"></div>
                    </div>
                </div>

                <div class="config-status" id="configStatus">
                    <!-- 由 JS 填充 -->
                </div>

                <div class="test-result" id="testResult">
                    <div class="test-result-title" id="testResultTitle"></div>
                    <div class="test-result-content" id="testResultContent"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="testConfigBtn">测试配置</button>
                <button class="btn btn-primary" id="saveConfigBtn">保存配置</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=20260919"></script>
</body>
</html>
